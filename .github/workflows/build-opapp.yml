name: Build OpenApp package

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 时需要给 Release 写权限；普通 push 用不到但不影响

env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate app package
        run: |
          python .opencode/skills/package-and-validate/scripts/validate_app_package.py .

      - name: Build .opapp.tgz
        run: |
          # 构建脚本把产物写到仓库的上一级目录，文件名由 manifest 的 app_id + version 决定
          python .opencode/skills/package-and-validate/scripts/build_opapp_tgz.py .
          mkdir -p dist
          cp ../*.opapp.tgz dist/
          ls -l dist

      # archive: false = 不包 zip；此时上传的必须是单个文件，
      # 产物名就是文件名（name 参数会被忽略），下载得到的直接是 .tgz
      - name: Upload .opapp.tgz
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.opapp.tgz
          archive: false
          if-no-files-found: error
          retention-days: 30

      # 打 tag（v*）时校验 tag 与 manifest.version 一致，防止版本号忘了改
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import json;print(json.load(open('manifest.json',encoding='utf-8'))['version'])")
          echo "tag=$TAG manifest.version=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 manifest.json 的 version $VER 不一致"
            exit 1
          fi

      # 打 tag（v*）时把 tgz 作为 Release 附件发布：原始文件、无 zip、不占 Artifact 保留期
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.opapp.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true
